<title>حاسبة السونار</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:#e8eef3;color:#1c2b36;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:480px;padding:16px 16px 28px}
.top{background:#2f5a78;color:#fff;border-radius:16px;padding:18px 14px;text-align:center;margin-bottom:14px}
.top small{display:block;opacity:.8;font-size:12px;margin-bottom:4px}
.top h1{margin:0;font-size:21px;direction:ltr}
.top h2{margin:6px 0 0;font-size:15px;font-weight:600;opacity:.9}
.box{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.box label{flex:0 0 38%;font-weight:700;font-size:14px;direction:ltr;text-align:left;color:#2f5a78}
.box select,.box input,.box output{flex:1;min-width:0;font-size:17px;padding:10px;border:1.5px solid #9db3c4;border-radius:8px;background:#f7fafc;color:#1c2b36;direction:ltr;text-align:center;font-family:inherit}
.box output{display:block;min-height:46px;font-weight:700}
.box.res{background:#2f5a78}
.box.res label{color:#fff}
.box.res output{background:#fff;color:#12476b;font-size:20px;border-color:#fff}
#msg{min-height:20px;margin:2px 4px 10px;font-size:13px;color:#a33;text-align:center}
#hint{font-size:12px;color:#5a6f7e;text-align:center;margin:0 4px 10px;direction:ltr}
.by{text-align:center;margin-top:16px;font-weight:700;color:#2f5a78;direction:ltr}

.lock{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);text-align:center}
.lock h3{margin:0 0 8px;color:#2f5a78;font-size:16px}
.lock p{margin:6px 0;font-size:13px;color:#4a5d6b}
.code{font-family:monospace;font-size:22px;font-weight:700;letter-spacing:2px;direction:ltr;background:#eef3f7;border-radius:8px;padding:10px;margin:8px 0;user-select:all;-webkit-user-select:all}
.lock textarea{width:100%;min-height:70px;font-size:14px;font-family:monospace;direction:ltr;border:1.5px solid #9db3c4;border-radius:8px;padding:8px;background:#f7fafc}
.btn{display:block;width:100%;margin-top:8px;padding:12px;font-size:16px;font-weight:700;border:0;border-radius:10px;background:#2f5a78;color:#fff;font-family:inherit}
.btn.alt{background:#dfe8ee;color:#2f5a78}
.note{background:#fff8e1;border:1.5px solid #f0d98a;color:#5a4500;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px;line-height:1.6;text-align:center;direction:rtl}
.note p{margin:3px 0}.note .warn{color:#a33;font-weight:700}
#explain{margin-top:10px;text-align:center}
#explain img{max-width:100%;max-height:62vh;border-radius:10px;border:1px solid #cfd9e1;background:#000}
#explain p{margin:8px 4px;font-size:14px;line-height:1.6}
#explain .cr{font-size:11px;color:#6a7d8a;direction:ltr}

.tools{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tools h3{margin:0 0 6px;color:#2f5a78;font-size:15px;text-align:center}
.tools textarea.f{width:100%;box-sizing:border-box;padding:10px;font-size:16px;border:1.5px solid #9db3c4;border-radius:8px;margin:4px 0;background:#f7fafc;color:#1c2b36;font-family:inherit;direction:rtl}
.tools input.f{width:100%;padding:10px;font-size:16px;border:1.5px solid #9db3c4;border-radius:8px;margin:4px 0;background:#f7fafc;color:#1c2b36;font-family:inherit}
.tools .row2{display:flex;gap:8px}.tools .row2 .btn{margin-top:8px}
.tools small{display:block;text-align:center;color:#5a6f7e;font-size:12px;min-height:16px;margin-top:4px}
.phprev{text-align:center;margin-top:8px}.phprev img{max-width:100%;max-height:200px;border-radius:8px;border:1px solid #cfd9e1}
#camov{position:fixed;left:0;top:0;right:0;bottom:0;background:#000;z-index:50;display:flex;flex-direction:column}
#camov video{flex:1;min-height:0;width:100%;object-fit:contain;background:#000}
#camov .cb{display:flex;gap:10px;padding:12px;background:#111}#camov .cb .btn{margin:0}
[hidden]{display:none!important}
#contactbtn:active,#contactbtn:focus{background:#157ab0!important;outline:3px solid #9fd6f0}
</style>

    if (b && (x < b[0] || x > b[1])){ msg.textContent = "المقاس خارج جدول " + name + " (" + fu(b[0]) + " إلى " + fu(b[1]) + " " + UN + ")"; setNote(notes); return; }
    var g = GAPS[name];
    if (sp === "equine" && g && x > g[0] && x < g[1]){ msg.textContent = "مفيش قيمة بين " + g[0] + " و " + g[1] + " مم في جدول " + name + ". استخدم " + g[0] + " أو " + g[1]; setNote(notes); return; }
    if (sp === "equine" && name === "Eye Length" && x >= 25) notes.push({t:EYE_NOTE, w:1});
    if (sp === "equine" && name === "Gestation Sac" && x > 17) notes.push({t:"المقاس فوق 17 مم: النتيجة تقريبية", w:1});
  }
  setNote(notes);
  if (raw === "") return;
  if (!UNLOCKED){ $("result").textContent = "\uD83D\uDD12"; $("months").textContent = "\uD83D\uDD12"; return; }
  var d = Math.round(age(sp, name, x));
  $("result").textContent = d + " days";
  LAST = {u:UN, ux:Math.round(x/UF*1000)/1000, sp:sp, name:name, x:x, d:d, months:fmtMonths(d), notes:notes};
  $("months").textContent = fmtMonths(d);
}

function wrapLines(ctx,text,maxW){ var ws=String(text).split(/\s+/), out=[], cur="";

function makePdf(cb){
  var n=digits(($("casebox").value||"").trim()).replace(/[^0-9A-Za-z\-\/]/g,"");
  var d=new Date(), ds=pad2(d.getDate())+"/"+pad2(d.getMonth()+1)+"/"+d.getFullYear()+"  "+pad2(d.getHours())+":"+pad2(d.getMinutes());
  function go(img){
    try{
      var c=drawReport(n,ds,docGet(),LAST,img), b64=c.toDataURL("image/jpeg",0.9).split(",")[1], bin=atob(b64), jb=new Uint8Array(bin.length);
      for(var i=0;i<bin.length;i++) jb[i]=bin.charCodeAt(i);
      LASTPDF={bytes:jpegToPdf(jb,c.width,c.height), name:"sonar-report-"+(n?n:pad2(d.getDate())+pad2(d.getMonth()+1)+d.getFullYear()+"-"+pad2(d.getHours())+pad2(d.getMinutes()))+".pdf", key:LAST.sp+"|"+LAST.name+"|"+LAST.x+"|"+LAST.u}; var keep=LASTPDF; $("desc").value=""; $("casebox").value=""; setPhoto(null,0); setPhoto(null,1); LASTPDF=keep; cb(LASTPDF);
    }catch(e){ $("toolmsg").textContent="حصلت مشكلة في عمل الـ PDF: "+e; }
  }
  var imgs=[null,null], left=0;
  function done(){ if(--left<=0){ LAST.desc=($("desc").value||"").trim(); go(imgs); } }
  for(var k=0;k<2;k++){ if(PHOTOS[k]){ left++; (function(k){ var im=new Image(); im.onload=function(){ imgs[k]=im; done(); }; im.onerror=function(){ done(); }; im.src=PHOTOS[k]; })(k); } }
  if(!left){ LAST.desc=($("desc").value||"").trim(); go(imgs); }
}
function pdfDownload(p){ var a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([p.bytes],{type:"application/pdf"})); a.download=p.name; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },4000); }
function needResult(){ var tm=$("toolmsg"); tm.textContent=""; if(!UNLOCKED||!LAST){ tm.textContent="احسب النتيجة الأول (اختار القياس وادخل الرقم)"; return true; } return false; }
$("pdfBtn").addEventListener("click", function(){
  if(needResult()) return;
  makePdf(function(p){
    if(window.SonarAndroid && SonarAndroid.sharePdf){ SonarAndroid.sharePdf(u8ToB64(p.bytes),p.name); return; }
    var f=null; try{ f=new File([p.bytes],p.name,{type:"application/pdf"}); }catch(e){}
    if(f && navigator.canShare && navigator.canShare({files:[f]})){ navigator.share({files:[f],title:p.name}).catch(function(){}); }
    else { pdfDownload(p); $("toolmsg").textContent="الجهاز مش بيدعم المشاركة المباشرة، نزّلت الملف: "+p.name; }
  });
});
$("pdfSave").addEventListener("click", function(){
  if(needResult()) return;
  function act(p){
    if(window.SonarAndroid && SonarAndroid.savePdf){ SonarAndroid.savePdf(u8ToB64(p.bytes),p.name); } else { pdfDownload(p); $("toolmsg").textContent="اتنزّل: "+p.name; }
  }
  if(LASTPDF && LASTPDF.key===LAST.sp+"|"+LAST.name+"|"+LAST.x+"|"+LAST.u) act(LASTPDF); else makePdf(act);
});
update();
(async function(){
  var sv=store("sonar_serial");
  if(sv && await verifySerial(sv)){ UNLOCKED=true; update(); }
})();
try{ if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js"); }catch(e){}
</script>
