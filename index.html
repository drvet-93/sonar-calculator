<title>حاسبة السونار</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:#e8eef3;color:#1c2b36;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:480px;padding:16px 16px 28px}
.top{background:#2f5a78;color:#fff;border-radius:16px;padding:18px 14px;text-align:center;margin-bottom:14px}
.top small{display:block;opacity:.8;font-size:12px;margin-bottom:4px}
.top h1{margin:0;font-size:21px;direction:ltr}
.top h2{margin:6px 0 0;font-size:15px;font-weight:600;opacity:.9}
.box{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.box label{flex:0 0 38%;font-weight:700;font-size:14px;direction:ltr;text-align:left;color:#2f5a78}
.box select,.box input,.box output{flex:1;min-width:0;font-size:17px;padding:10px;border:1.5px solid #9db3c4;border-radius:8px;background:#f7fafc;color:#1c2b36;direction:ltr;text-align:center;font-family:inherit}
.box output{display:block;min-height:46px;font-weight:700}
.box.res{background:#2f5a78}
.box.res label{color:#fff}
.box.res output{background:#fff;color:#12476b;font-size:20px;border-color:#fff}
#msg{min-height:20px;margin:2px 4px 10px;font-size:13px;color:#a33;text-align:center}
#hint{font-size:12px;color:#5a6f7e;text-align:center;margin:0 4px 10px;direction:ltr}
.by{text-align:center;margin-top:16px;font-weight:700;color:#2f5a78;direction:ltr}

.lock{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);text-align:center}
.lock h3{margin:0 0 8px;color:#2f5a78;font-size:16px}
.lock p{margin:6px 0;font-size:13px;color:#4a5d6b}
.code{font-family:monospace;font-size:22px;font-weight:700;letter-spacing:2px;direction:ltr;background:#eef3f7;border-radius:8px;padding:10px;margin:8px 0;user-select:all;-webkit-user-select:all}
.lock textarea{width:100%;min-height:70px;font-size:14px;font-family:monospace;direction:ltr;border:1.5px solid #9db3c4;border-radius:8px;padding:8px;background:#f7fafc}
.btn{display:block;width:100%;margin-top:8px;padding:12px;font-size:16px;font-weight:700;border:0;border-radius:10px;background:#2f5a78;color:#fff;font-family:inherit}
.btn.alt{background:#dfe8ee;color:#2f5a78}
.note{background:#fff8e1;border:1.5px solid #f0d98a;color:#5a4500;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px;line-height:1.6;text-align:center;direction:rtl}
.note p{margin:3px 0}.note .warn{color:#a33;font-weight:700}
#explain{margin-top:10px;text-align:center}
#explain img{max-width:100%;max-height:62vh;border-radius:10px;border:1px solid #cfd9e1;background:#000}
#explain p{margin:8px 4px;font-size:14px;line-height:1.6}
#explain .cr{font-size:11px;color:#6a7d8a;direction:ltr}
[hidden]{display:none!important}
#contactbtn:active,#contactbtn:focus{background:#157ab0!important;outline:3px solid #9fd6f0}
</style>
